<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{eventos/_layout :: head}"></head>
<body class="bg-gray-50 antialiased" x-data="eventDetail()">

<div th:replace="~{eventos/_layout :: toastWidget}"></div>

<script th:inline="javascript">
    window.__event         = /*[[${event}]]*/ {};
    window.__setlists      = /*[[${setlists}]]*/ [];
    window.__professionals = /*[[${professionals}]]*/ [];
</script>

<!-- ══════════════════════════════════════════════════════════════════════ -->
<main class="max-w-2xl mx-auto px-4 py-8">

    <!-- Voltar -->
    <a href="/eventos/ui"
       class="inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-gray-800
              mb-6 transition-colors group">
        <svg class="w-4 h-4 group-hover:-translate-x-0.5 transition-transform"
             fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
        Voltar para Eventos
    </a>

    <!-- Card principal -->
    <div class="bg-white rounded-2xl border border-gray-200 shadow-sm overflow-hidden">

        <!-- Header colorido por tipo -->
        <div class="px-6 py-5 border-b border-gray-100"
             :class="headerClass(event.type)">
            <div class="flex items-start justify-between gap-4">
                <div class="flex-1 min-w-0">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold
                                 border mb-2" :class="typeBadgeClass(event.type)"
                          x-text="typeLabels[event.type] || event.type"></span>
                    <h1 class="text-xl font-bold text-gray-900 truncate"
                        x-text="event.location"></h1>
                </div>
                <!-- Ações -->
                <div class="flex items-center gap-1.5 shrink-0">
                    <button @click="openEdit()"
                            title="Editar"
                            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm
                                   font-medium text-gray-600 bg-white border border-gray-200
                                   hover:bg-brand-50 hover:text-brand-700 hover:border-brand-200
                                   shadow-sm transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5
                                     m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                        </svg>
                        Editar
                    </button>
                    <button @click="openDelete()"
                            title="Excluir"
                            class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-lg text-sm
                                   font-medium text-gray-600 bg-white border border-gray-200
                                   hover:bg-red-50 hover:text-red-700 hover:border-red-200
                                   shadow-sm transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                  d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0
                                     01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0
                                     00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                        Excluir
                    </button>
                </div>
            </div>
        </div>

        <!-- Detalhes -->
        <div class="px-6 py-5 space-y-5">

            <!-- Data e hora -->
            <div class="flex items-start gap-3">
                <div class="mt-0.5 p-2 rounded-lg bg-gray-100 shrink-0">
                    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5
                                 a2 2 0 00-2 2v12a2 2 0 002 2z"/>
                    </svg>
                </div>
                <div>
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-0.5">Data e hora</p>
                    <p class="text-sm font-semibold text-gray-800 tabular-nums"
                       x-text="fmtDate(event.dateTime)"></p>
                </div>
            </div>

            <!-- Notas -->
            <div class="flex items-start gap-3" x-show="event.notes">
                <div class="mt-0.5 p-2 rounded-lg bg-gray-100 shrink-0">
                    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586
                                 a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                    </svg>
                </div>
                <div>
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-0.5">Notas</p>
                    <p class="text-sm text-gray-700" x-text="event.notes"></p>
                </div>
            </div>

            <!-- Setlist -->
            <div class="flex items-start gap-3">
                <div class="mt-0.5 p-2 rounded-lg bg-gray-100 shrink-0">
                    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2
                                 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
                    </svg>
                </div>
                <div>
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-0.5">Setlist</p>
                    <template x-if="event.setlist">
                        <a :href="`/repertorio/ui/setlists/${event.setlist.id}`"
                           title="Ver setlist"
                           class="inline-flex items-center px-2.5 py-1 rounded-lg text-sm font-medium
                                  bg-indigo-50 text-indigo-700 border border-indigo-100
                                  hover:bg-indigo-100 transition-colors"
                           x-text="event.setlist.name"></a>
                    </template>
                    <template x-if="!event.setlist">
                        <span class="text-sm text-gray-400 italic">Nenhum setlist associado</span>
                    </template>
                </div>
            </div>

            <!-- Profissionais -->
            <div class="flex items-start gap-3">
                <div class="mt-0.5 p-2 rounded-lg bg-gray-100 shrink-0">
                    <svg class="w-4 h-4 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                              d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-5.13a4 4 0 11-8
                                 0 4 4 0 018 0zm6 3a4 4 0 10-8 0"/>
                    </svg>
                </div>
                <div>
                    <p class="text-xs font-medium text-gray-400 uppercase tracking-wide mb-0.5">Profissionais</p>
                    <div class="flex flex-wrap gap-1.5" x-show="assignedProfessionals.length > 0">
                        <template x-for="p in assignedProfessionals" :key="p.id">
                            <span class="inline-flex items-center px-2.5 py-1 rounded-lg text-sm font-medium
                                         bg-amber-50 text-amber-700 border border-amber-100"
                                  x-text="p.name"></span>
                        </template>
                    </div>
                    <span class="text-sm text-gray-400 italic" x-show="assignedProfessionals.length === 0">
                        Nenhum profissional vinculado
                    </span>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- ══════════════════════════════════════════════════════════════════════ -->
<!-- Modal — Editar                                                        -->
<!-- ══════════════════════════════════════════════════════════════════════ -->
<div x-cloak x-show="modal.open"
     x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-40 flex items-center justify-center p-4"
     @keydown.escape.window="closeModal()">

    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" @click="closeModal()"></div>

    <div x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95 translate-y-2"
         x-transition:enter-end="opacity-100 scale-100 translate-y-0"
         class="relative z-10 bg-white rounded-2xl shadow-2xl w-full max-w-md">

        <div class="flex items-center justify-between px-6 pt-6 pb-4 border-b border-gray-100">
            <div>
                <h2 class="text-lg font-semibold text-gray-900">Editar Evento</h2>
                <p class="text-xs text-gray-400 mt-0.5">Atualize as informações do evento</p>
            </div>
            <button @click="closeModal()"
                    class="p-1.5 rounded-lg text-gray-400 hover:text-gray-600
                           hover:bg-gray-100 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <form @submit.prevent="save()" class="px-6 py-5 space-y-4" novalidate>

            <!-- Tipo + Data -->
            <div class="grid grid-cols-2 gap-3">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">
                        Tipo <span class="text-red-500">*</span>
                    </label>
                    <select x-model="form.type" @change="errors.type = ''"
                            :class="errors.type ? 'border-red-400 focus:ring-red-400' : 'border-gray-200 focus:ring-brand-500'"
                            class="w-full px-3 py-2.5 text-sm border rounded-lg shadow-sm bg-white
                                   focus:outline-none focus:ring-2 focus:border-transparent
                                   transition appearance-none cursor-pointer">
                        <option value="SHOW">Show</option>
                        <option value="REHEARSAL">Ensaio</option>
                        <option value="MEETING">Reunião</option>
                        <option value="OTHER">Outro</option>
                    </select>
                    <p x-show="errors.type" x-text="errors.type" class="mt-1 text-xs text-red-500"></p>
                </div>
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1.5">
                        Data e hora <span class="text-red-500">*</span>
                    </label>
                    <input x-model="form.dateTime" @change="errors.dateTime = ''"
                           type="datetime-local"
                           :class="errors.dateTime ? 'border-red-400 focus:ring-red-400' : 'border-gray-200 focus:ring-brand-500'"
                           class="w-full px-3 py-2.5 text-sm border rounded-lg shadow-sm
                                  focus:outline-none focus:ring-2 focus:border-transparent transition"/>
                    <p x-show="errors.dateTime" x-text="errors.dateTime" class="mt-1 text-xs text-red-500"></p>
                </div>
            </div>

            <!-- Local -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">
                    Local <span class="text-red-500">*</span>
                </label>
                <input x-model.trim="form.location" @input="errors.location = ''"
                       x-ref="locationInput" type="text"
                       placeholder="Ex: Teatro Municipal, Studio A…"
                       :class="errors.location ? 'border-red-400 focus:ring-red-400' : 'border-gray-200 focus:ring-brand-500'"
                       class="w-full px-3.5 py-2.5 text-sm border rounded-lg shadow-sm
                              focus:outline-none focus:ring-2 focus:border-transparent
                              placeholder-gray-300 transition"/>
                <p x-show="errors.location" x-text="errors.location" class="mt-1 text-xs text-red-500"></p>
            </div>

            <!-- Notas -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">
                    Notas <span class="text-xs text-gray-400 font-normal">(opcional)</span>
                </label>
                <textarea x-model="form.notes" rows="2"
                          placeholder="Observações, instruções ou detalhes do evento…"
                          class="w-full px-3.5 py-2.5 text-sm border border-gray-200 rounded-lg
                                 shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-500
                                 focus:border-transparent placeholder-gray-300
                                 transition resize-none"></textarea>
            </div>

            <!-- Setlist -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">
                    Setlist <span class="text-xs text-gray-400 font-normal">(opcional)</span>
                </label>
                <select x-model="form.setlistId"
                        class="w-full px-3 py-2.5 text-sm border border-gray-200 rounded-lg
                               shadow-sm bg-white focus:outline-none focus:ring-2
                               focus:ring-brand-500 focus:border-transparent
                               transition appearance-none cursor-pointer">
                    <option value="">— Nenhum —</option>
                    <template x-for="sl in setlists" :key="sl.id">
                        <option :value="sl.id" x-text="sl.name"></option>
                    </template>
                </select>
            </div>

            <!-- Profissionais -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">
                    Profissionais
                    <span class="text-xs text-gray-400 font-normal">(quem estará no evento)</span>
                </label>
                <div class="max-h-40 overflow-y-auto border border-gray-200 rounded-lg divide-y divide-gray-100">
                    <template x-for="p in professionals" :key="p.id">
                        <label class="flex items-center gap-2.5 px-3 py-2 cursor-pointer hover:bg-gray-50 select-none">
                            <input type="checkbox" :value="p.id" x-model="form.professionalIds"
                                   class="w-4 h-4 rounded border-gray-300 text-brand-600
                                          focus:ring-brand-500 focus:ring-offset-0"/>
                            <span class="text-sm text-gray-700 flex-1" x-text="p.name"></span>
                            <span class="text-xs text-gray-400" x-text="p.role"></span>
                        </label>
                    </template>
                    <p x-show="professionals.length === 0" class="px-3 py-4 text-xs text-gray-400 text-center">
                        Nenhum profissional cadastrado.
                    </p>
                </div>
            </div>

            <!-- Botões -->
            <div class="flex gap-3 pt-1">
                <button type="button" @click="closeModal()"
                        class="flex-1 px-4 py-2.5 text-sm font-medium text-gray-700
                               bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
                    Cancelar
                </button>
                <button type="submit" :disabled="saving"
                        class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5
                               text-sm font-medium text-white bg-brand-600 hover:bg-brand-700
                               disabled:opacity-60 disabled:cursor-not-allowed rounded-lg
                               transition-colors focus:outline-none focus:ring-2
                               focus:ring-brand-500 focus:ring-offset-2">
                    <svg x-show="saving" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                        <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                    </svg>
                    <span x-text="saving ? 'Salvando…' : 'Salvar'"></span>
                </button>
            </div>
        </form>
    </div>
</div>

<!-- ══════════════════════════════════════════════════════════════════════ -->
<!-- Dialog — Confirmar exclusão                                           -->
<!-- ══════════════════════════════════════════════════════════════════════ -->
<div x-cloak x-show="deleteDialog.open"
     x-transition:enter="transition ease-out duration-200" x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150" x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-40 flex items-center justify-center p-4"
     @keydown.escape.window="closeDelete()">

    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" @click="closeDelete()"></div>

    <div x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         class="relative z-10 bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">

        <div class="flex items-center justify-center w-12 h-12 mx-auto mb-4 rounded-full bg-red-50">
            <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0
                         01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0
                         00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
            </svg>
        </div>

        <h3 class="text-center text-base font-semibold text-gray-900 mb-1">Excluir evento</h3>
        <p class="text-center text-sm text-gray-500 mb-1">Tem certeza que deseja excluir o evento em</p>
        <p class="text-center font-semibold text-gray-800 mb-5"
           x-text="`&quot;${event.location}&quot;`"></p>
        <p class="text-center text-xs text-gray-400 mb-5">Esta ação não pode ser desfeita.</p>

        <div class="flex gap-3">
            <button @click="closeDelete()"
                    class="flex-1 px-4 py-2.5 text-sm font-medium text-gray-700
                           bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
                Cancelar
            </button>
            <button @click="executeDelete()" :disabled="deleting"
                    class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5
                           text-sm font-medium text-white bg-red-600 hover:bg-red-700
                           disabled:opacity-60 disabled:cursor-not-allowed rounded-lg
                           transition-colors">
                <svg x-show="deleting" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                </svg>
                <span x-text="deleting ? 'Excluindo…' : 'Sim, excluir'"></span>
            </button>
        </div>
    </div>
</div>

<!-- ══════════════════════════════════════════════════════════════════════ -->
<th:block th:replace="~{eventos/_layout :: scripts}"></th:block>
<script>
function normalizeDt(dt) {
    if (!dt) return ''
    if (Array.isArray(dt)) {
        const [y, mo, d, h = 0, mi = 0, s = 0] = dt
        const pad = n => String(n).padStart(2, '0')
        return `${y}-${pad(mo)}-${pad(d)}T${pad(h)}:${pad(mi)}:${pad(s)}`
    }
    return String(dt)
}

function eventDetail() {
    const raw = window.__event || {}
    return {
        event: { ...raw, dateTime: normalizeDt(raw.dateTime) },
        setlists:      window.__setlists      || [],
        professionals: window.__professionals || [],
        saving:  false,
        deleting: false,

        modal:        { open: false },
        form:         { type: '', dateTime: '', location: '', notes: '', setlistId: '', professionalIds: [] },
        errors:       { type: '', dateTime: '', location: '' },
        deleteDialog: { open: false },

        /* ── Computed ──────────────────────────────────────────────── */
        get assignedProfessionals() {
            return (this.event.professionalIds || [])
                .map(id => this.professionals.find(p => p.id === id))
                .filter(Boolean)
        },

        /* ── Labels ────────────────────────────────────────────────── */
        typeLabels: {
            SHOW:      'Show',
            REHEARSAL: 'Ensaio',
            MEETING:   'Reunião',
            OTHER:     'Outro'
        },

        typeBadgeClass(type) {
            return ({
                SHOW:      'bg-emerald-100 text-emerald-700 border-emerald-200',
                REHEARSAL: 'bg-blue-100 text-blue-700 border-blue-200',
                MEETING:   'bg-purple-100 text-purple-700 border-purple-200',
                OTHER:     'bg-gray-100 text-gray-600 border-gray-200'
            })[type] || 'bg-gray-100 text-gray-600 border-gray-200'
        },

        headerClass(type) {
            return ({
                SHOW:      'bg-emerald-50 border-emerald-100',
                REHEARSAL: 'bg-blue-50 border-blue-100',
                MEETING:   'bg-purple-50 border-purple-100',
                OTHER:     'bg-gray-50 border-gray-100'
            })[type] || 'bg-gray-50 border-gray-100'
        },

        /* ── Modal de edição ────────────────────────────────────────── */
        openEdit() {
            this.form = {
                type:      this.event.type,
                dateTime:  toInputDt(this.event.dateTime),
                location:  this.event.location,
                notes:     this.event.notes || '',
                setlistId: this.event.setlist ? this.event.setlist.id : '',
                professionalIds: [...(this.event.professionalIds || [])]
            }
            this.errors = { type: '', dateTime: '', location: '' }
            this.modal.open = true
            this.$nextTick(() => this.$refs.locationInput?.focus())
        },

        closeModal() {
            this.modal.open = false
            this.saving = false
        },

        validate() {
            this.errors = { type: '', dateTime: '', location: '' }
            let ok = true
            if (!this.form.type)            { this.errors.type     = 'Selecione o tipo.';      ok = false }
            if (!this.form.dateTime)        { this.errors.dateTime = 'Informe a data e hora.'; ok = false }
            if (!this.form.location.trim()) { this.errors.location = 'Informe o local.';       ok = false }
            return ok
        },

        async save() {
            if (!this.validate()) return
            this.saving = true
            try {
                const payload = {
                    type:            this.form.type,
                    dateTime:        this.form.dateTime,
                    location:        this.form.location.trim(),
                    notes:           this.form.notes.trim() || null,
                    setlistId:       this.form.setlistId || null,
                    professionalIds: this.form.professionalIds
                }
                const res = await fetch(`/eventos/${this.event.id}`, {
                    method:  'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body:    JSON.stringify(payload)
                })
                if (!res.ok) throw new Error(await readError(res))

                this.event.type     = payload.type
                this.event.dateTime = this.form.dateTime + ':00'
                this.event.location = payload.location
                this.event.notes    = payload.notes
                this.event.setlist  = payload.setlistId
                    ? (this.setlists.find(s => s.id === payload.setlistId) || null)
                    : null
                this.event.professionalIds = payload.professionalIds

                this.closeModal()
                this.$store.toast.success('Evento atualizado!')
            } catch (err) {
                this.$store.toast.error(err.message || 'Erro ao salvar o evento.')
            } finally {
                this.saving = false
            }
        },

        /* ── Exclusão ───────────────────────────────────────────────── */
        openDelete() {
            this.deleteDialog.open = true
        },

        closeDelete() {
            this.deleteDialog.open = false
            this.deleting = false
        },

        async executeDelete() {
            this.deleting = true
            try {
                const res = await fetch(`/eventos/${this.event.id}`, { method: 'DELETE' })
                if (!res.ok) throw new Error(await readError(res))
                window.location.href = '/eventos/ui'
            } catch (err) {
                this.$store.toast.error(err.message || 'Erro ao excluir o evento.')
                this.closeDelete()
            } finally {
                this.deleting = false
            }
        }
    }
}
</script>

</body>
</html>
