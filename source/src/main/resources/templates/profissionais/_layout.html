<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<!--
  Biblioteca de fragmentos do módulo Profissionais.
  Fragmentos: head · toastWidget · scripts
-->

<head th:fragment="head">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title th:text="${pageTitle != null ? pageTitle + ' · Profissionais' : 'Profissionais'}">Profissionais</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50:  '#f0f4ff', 100: '#dce6ff', 200: '#b9ccff',
                            400: '#6b87fa', 500: '#4f6ef7', 600: '#3b5bf0', 700: '#2c47d9'
                        }
                    }
                }
            }
        }
    </script>

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>

    <style>
        [x-cloak] { display: none !important; }
        ::-webkit-scrollbar        { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track  { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb  { background: #cbd5e1; border-radius: 3px; }
    </style>
</head>

<div th:fragment="toastWidget"
     x-cloak
     x-show="$store.toast.visible"
     x-transition:enter="transition ease-out duration-300"
     x-transition:enter-start="opacity-0 translate-y-2"
     x-transition:enter-end="opacity-100 translate-y-0"
     x-transition:leave="transition ease-in duration-200"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0 translate-y-2"
     :class="$store.toast.type === 'error' ? 'bg-red-600' : 'bg-emerald-600'"
     class="fixed top-4 right-4 z-50 flex items-start gap-3 text-white
            rounded-xl px-4 py-3 shadow-xl max-w-sm text-sm leading-snug">
    <span x-show="$store.toast.type === 'success'" class="mt-0.5 shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
        </svg>
    </span>
    <span x-show="$store.toast.type === 'error'" class="mt-0.5 shrink-0">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
        </svg>
    </span>
    <p x-text="$store.toast.message" class="flex-1"></p>
    <button @click="$store.toast.hide()" class="ml-1 shrink-0 opacity-70 hover:opacity-100 transition-opacity">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
    </button>
</div>

<th:block th:fragment="scripts">
<script>
document.addEventListener('alpine:init', () => {
    Alpine.store('toast', {
        visible: false, message: '', type: 'success', _timer: null,
        show(message, type = 'success', duration = 5000) {
            clearTimeout(this._timer)
            this.message = message; this.type = type; this.visible = true
            this._timer = setTimeout(() => this.hide(), duration)
        },
        success(msg)           { this.show(msg, 'success') },
        error(msg, dur = 8000) { this.show(msg, 'error', dur) },
        hide()                 { this.visible = false }
    })

    window.readError = async function(response) {
        try {
            const b = await response.clone().json()
            return b.message || b.error || `Erro ${response.status}`
        } catch (_) { return `Erro ${response.status}` }
    }
})
</script>
</th:block>

<body></body>
</html>
