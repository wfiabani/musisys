<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{profissionais/_layout :: head}"></head>
<body class="bg-gray-50 antialiased" x-data="professionalManager()">

<!-- Toast global -->
<div th:replace="~{profissionais/_layout :: toastWidget}"></div>

<!-- ══════════════════════════════════════════════════════════════════════ -->
<!-- Dados iniciais injetados pelo Thymeleaf                              -->
<!-- ══════════════════════════════════════════════════════════════════════ -->
<script th:inline="javascript">
    window.__professionals = /*[[${professionals}]]*/ [];
</script>

<!-- ══════════════════════════════════════════════════════════════════════ -->
<!-- Página                                                                -->
<!-- ══════════════════════════════════════════════════════════════════════ -->
<main class="max-w-5xl mx-auto px-4 py-8">

    <!-- Cabeçalho -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 class="text-2xl font-bold text-gray-900">Profissionais</h1>
            <p class="text-sm text-gray-500 mt-0.5">Gerencie músicos, roadies e demais profissionais da banda</p>
        </div>
        <button @click="openCreate()"
                class="inline-flex items-center gap-2 bg-brand-600 hover:bg-brand-700
                       text-white text-sm font-medium px-4 py-2.5 rounded-lg
                       shadow-sm transition-colors focus:outline-none focus:ring-2
                       focus:ring-brand-500 focus:ring-offset-2">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Novo Profissional
        </button>
    </div>

    <!-- Barra de busca -->
    <div class="relative mb-4">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-gray-400 pointer-events-none"
             fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                  d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
        </svg>
        <input x-model="search"
               type="text"
               placeholder="Buscar por nome ou função…"
               class="w-full pl-10 pr-4 py-2.5 text-sm bg-white border border-gray-200
                      rounded-lg shadow-sm placeholder-gray-400 focus:outline-none
                      focus:ring-2 focus:ring-brand-500 focus:border-transparent transition"/>
        <button x-show="search" @click="search = ''"
                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>

    <!-- Tabela -->
    <div class="bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">
        <table class="w-full text-sm">
            <thead>
                <tr class="bg-gray-50 border-b border-gray-200 text-xs font-semibold
                           text-gray-500 uppercase tracking-wide">
                    <th class="px-4 py-3 text-left w-10">#</th>
                    <th class="px-4 py-3 text-left">Nome</th>
                    <th class="px-4 py-3 text-left">Função</th>
                    <th class="px-4 py-3 text-center w-24">Default</th>
                    <th class="px-4 py-3 text-right w-28">Ações</th>
                </tr>
            </thead>
            <tbody>
                <!-- Linhas dos profissionais -->
                <template x-for="(professional, index) in filteredProfessionals" :key="professional.id">
                    <tr class="border-b border-gray-100 last:border-0
                               hover:bg-brand-50 transition-colors group">
                        <td class="px-4 py-3 text-gray-400 tabular-nums"
                            x-text="index + 1"></td>
                        <td class="px-4 py-3">
                            <span class="font-medium text-gray-900" x-text="professional.name"></span>
                        </td>
                        <td class="px-4 py-3 text-gray-600" x-text="professional.role"></td>
                        <td class="px-4 py-3 text-center">
                            <span x-show="professional.isDefault"
                                  class="inline-block px-2 py-0.5 rounded-md text-xs font-semibold
                                         bg-emerald-50 text-emerald-700 border border-emerald-100">
                                Ativo
                            </span>
                            <span x-show="!professional.isDefault" class="text-gray-300">—</span>
                        </td>
                        <td class="px-4 py-3">
                            <div class="flex items-center justify-end gap-1
                                        opacity-0 group-hover:opacity-100 transition-opacity">
                                <!-- Editar -->
                                <button @click="openEdit(professional)"
                                        title="Editar"
                                        class="p-1.5 rounded-md text-gray-400 hover:text-brand-600
                                               hover:bg-brand-50 transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                              d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5
                                                 m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                                    </svg>
                                </button>
                                <!-- Excluir -->
                                <button @click="openDelete(professional)"
                                        title="Excluir"
                                        class="p-1.5 rounded-md text-gray-400 hover:text-red-600
                                               hover:bg-red-50 transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                              d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0
                                                 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0
                                                 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                    </svg>
                                </button>
                            </div>
                        </td>
                    </tr>
                </template>

                <!-- Estado vazio -->
                <tr x-show="filteredProfessionals.length === 0">
                    <td colspan="5" class="px-4 py-16 text-center">
                        <div class="flex flex-col items-center gap-3 text-gray-400">
                            <svg class="w-10 h-10 opacity-40" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                                      d="M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-5.13a4 4 0 11-8
                                         0 4 4 0 018 0zm6 3a4 4 0 10-8 0"/>
                            </svg>
                            <p x-show="search" class="text-sm">
                                Nenhum profissional encontrado para "<span class="font-medium" x-text="search"></span>"
                            </p>
                            <p x-show="!search" class="text-sm">
                                Nenhum profissional cadastrado ainda.
                            </p>
                            <button x-show="!search" @click="openCreate()"
                                    class="text-sm text-brand-600 hover:underline font-medium">
                                Adicionar o primeiro profissional
                            </button>
                        </div>
                    </td>
                </tr>
            </tbody>
        </table>

        <!-- Rodapé da tabela -->
        <div x-show="professionals.length > 0"
             class="px-4 py-2.5 bg-gray-50 border-t border-gray-100 text-xs text-gray-400 flex justify-between">
            <span x-text="`${filteredProfessionals.length} de ${professionals.length} profissionais`"></span>
            <span x-show="search" x-text="`Filtrando por '${search}'`"></span>
        </div>
    </div>
</main>


<!-- ══════════════════════════════════════════════════════════════════════ -->
<!-- Modal — Criar / Editar Profissional                                  -->
<!-- ══════════════════════════════════════════════════════════════════════ -->
<div x-cloak
     x-show="modal.open"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-40 flex items-center justify-center p-4"
     @keydown.escape.window="closeModal()">

    <!-- Overlay -->
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" @click="closeModal()"></div>

    <!-- Painel -->
    <div x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95 translate-y-2"
         x-transition:enter-end="opacity-100 scale-100 translate-y-0"
         x-transition:leave="transition ease-in duration-150"
         x-transition:leave-start="opacity-100 scale-100"
         x-transition:leave-end="opacity-0 scale-95"
         class="relative z-10 bg-white rounded-2xl shadow-2xl w-full max-w-md max-h-[90vh] flex flex-col">

        <!-- Cabeçalho do modal -->
        <div class="flex items-center justify-between px-6 pt-6 pb-4 border-b border-gray-100">
            <div>
                <h2 class="text-lg font-semibold text-gray-900"
                    x-text="modal.mode === 'create' ? 'Novo Profissional' : 'Editar Profissional'"></h2>
                <p class="text-xs text-gray-400 mt-0.5"
                   x-text="modal.mode === 'create'
                       ? 'Preencha os dados do novo profissional'
                       : 'Atualize as informações do profissional'"></p>
            </div>
            <button @click="closeModal()"
                    class="p-1.5 rounded-lg text-gray-400 hover:text-gray-600 hover:bg-gray-100 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- Formulário -->
        <form @submit.prevent="save()" class="px-6 py-5 space-y-4 overflow-y-auto" novalidate>

            <!-- Nome -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">
                    Nome <span class="text-red-500">*</span>
                </label>
                <input x-model.trim="form.name"
                       @input="errors.name = ''"
                       type="text"
                       placeholder="Ex: João Silva"
                       :class="errors.name
                           ? 'border-red-400 focus:ring-red-400'
                           : 'border-gray-200 focus:ring-brand-500'"
                       class="w-full px-3.5 py-2.5 text-sm border rounded-lg shadow-sm
                              focus:outline-none focus:ring-2 focus:border-transparent
                              placeholder-gray-300 transition"/>
                <p x-show="errors.name" x-text="errors.name"
                   class="mt-1.5 text-xs text-red-500"></p>
            </div>

            <!-- Função -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">
                    Função na banda <span class="text-red-500">*</span>
                </label>
                <input x-model.trim="form.role"
                       @input="errors.role = ''"
                       type="text"
                       placeholder="Ex: Baterista, Roadie, Motorista…"
                       :class="errors.role
                           ? 'border-red-400 focus:ring-red-400'
                           : 'border-gray-200 focus:ring-brand-500'"
                       class="w-full px-3.5 py-2.5 text-sm border rounded-lg shadow-sm
                              focus:outline-none focus:ring-2 focus:border-transparent
                              placeholder-gray-300 transition"/>
                <p x-show="errors.role" x-text="errors.role"
                   class="mt-1.5 text-xs text-red-500"></p>
            </div>

            <!-- Descrição -->
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1.5">
                    Descrição
                    <span class="text-gray-400 font-normal text-xs ml-1">opcional</span>
                </label>
                <textarea x-model="form.description"
                          @input="$el.style.height = 'auto'; $el.style.height = $el.scrollHeight + 'px'"
                          x-effect="form.description; $nextTick(() => { $el.style.height = 'auto'; $el.style.height = ($el.scrollHeight || 80) + 'px' })"
                          rows="3"
                          placeholder="Observações sobre o profissional…"
                          class="w-full px-3.5 py-2.5 text-sm border border-gray-200 rounded-lg
                                 shadow-sm focus:outline-none focus:ring-2 focus:ring-brand-500
                                 focus:border-transparent placeholder-gray-300 transition
                                 resize-none leading-relaxed"></textarea>
            </div>

            <!-- Default -->
            <label class="flex items-center gap-2.5 cursor-pointer select-none">
                <input type="checkbox" x-model="form.isDefault"
                       class="w-4 h-4 rounded border-gray-300 text-brand-600
                              focus:ring-brand-500 focus:ring-offset-0"/>
                <span class="text-sm text-gray-700">
                    Membro ativo da banda (marcado automaticamente em novos eventos)
                </span>
            </label>

            <!-- Rodapé do form -->
            <div class="flex gap-3 pt-2">
                <button type="button" @click="closeModal()"
                        class="flex-1 px-4 py-2.5 text-sm font-medium text-gray-700
                               bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
                    Cancelar
                </button>
                <button type="submit"
                        :disabled="saving"
                        class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5
                               text-sm font-medium text-white bg-brand-600 hover:bg-brand-700
                               disabled:opacity-60 disabled:cursor-not-allowed rounded-lg
                               transition-colors focus:outline-none focus:ring-2
                               focus:ring-brand-500 focus:ring-offset-2">
                    <svg x-show="saving" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                        <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                        <path class="opacity-75" fill="currentColor"
                              d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                    </svg>
                    <span x-text="saving ? 'Salvando…' : (modal.mode === 'create' ? 'Adicionar' : 'Salvar')"></span>
                </button>
            </div>
        </form>
    </div>
</div>


<!-- ══════════════════════════════════════════════════════════════════════ -->
<!-- Dialog — Confirmação de exclusão                                     -->
<!-- ══════════════════════════════════════════════════════════════════════ -->
<div x-cloak
     x-show="deleteDialog.open"
     x-transition:enter="transition ease-out duration-200"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition ease-in duration-150"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 z-40 flex items-center justify-center p-4"
     @keydown.escape.window="closeDelete()">

    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm" @click="closeDelete()"></div>

    <div x-transition:enter="transition ease-out duration-200"
         x-transition:enter-start="opacity-0 scale-95"
         x-transition:enter-end="opacity-100 scale-100"
         class="relative z-10 bg-white rounded-2xl shadow-2xl w-full max-w-sm p-6">

        <!-- Ícone de alerta -->
        <div class="flex items-center justify-center w-12 h-12 mx-auto mb-4
                    rounded-full bg-red-50">
            <svg class="w-6 h-6 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                      d="M12 9v2m0 4h.01M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94
                         a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z"/>
            </svg>
        </div>

        <h3 class="text-center text-base font-semibold text-gray-900 mb-1">Excluir profissional</h3>
        <p class="text-center text-sm text-gray-500 mb-5">
            Tem certeza que deseja excluir
            <strong class="text-gray-800" x-text="`"${deleteDialog.professional?.name}"`"></strong>?
            Esta ação não pode ser desfeita.
        </p>

        <!-- Mensagem de erro (409 — vinculado a evento já ocorrido) -->
        <div x-show="deleteDialog.errorMsg"
             x-transition
             class="mb-4 p-3.5 rounded-lg bg-amber-50 border border-amber-200 text-sm">
            <div class="flex gap-2.5">
                <svg class="w-4 h-4 text-amber-600 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                          d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                </svg>
                <div>
                    <p class="font-medium text-amber-800">Não foi possível excluir</p>
                    <p class="text-amber-700 mt-0.5" x-text="deleteDialog.errorMsg"></p>
                </div>
            </div>
        </div>

        <!-- Botões -->
        <div class="flex gap-3">
            <button @click="closeDelete()"
                    class="flex-1 px-4 py-2.5 text-sm font-medium text-gray-700
                           bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">
                Cancelar
            </button>
            <button @click="executeDelete()"
                    :disabled="deleting"
                    class="flex-1 inline-flex items-center justify-center gap-2 px-4 py-2.5
                           text-sm font-medium text-white bg-red-600 hover:bg-red-700
                           disabled:opacity-60 disabled:cursor-not-allowed rounded-lg
                           transition-colors">
                <svg x-show="deleting" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                </svg>
                <span x-text="deleting ? 'Excluindo…' : 'Sim, excluir'"></span>
            </button>
        </div>
    </div>
</div>


<!-- ══════════════════════════════════════════════════════════════════════ -->
<!-- Scripts                                                              -->
<!-- ══════════════════════════════════════════════════════════════════════ -->
<th:block th:replace="~{profissionais/_layout :: scripts}"></th:block>

<script>
function professionalManager() {
    return {

        /* ── Estado principal ──────────────────────────────────────────── */
        professionals: window.__professionals || [],
        search:        '',
        saving:        false,
        deleting:      false,

        modal: {
            open: false,
            mode: 'create',   // 'create' | 'edit'
            id:   null
        },

        form:   { name: '', role: '', description: '', isDefault: false },
        errors: { name: '', role: '' },

        deleteDialog: {
            open:         false,
            professional: null,
            errorMsg:     ''
        },

        /* ── Computed ──────────────────────────────────────────────────── */
        get filteredProfessionals() {
            const q = this.search.toLowerCase().trim()
            if (!q) return this.professionals
            return this.professionals.filter(p =>
                p.name.toLowerCase().includes(q) ||
                p.role.toLowerCase().includes(q)
            )
        },

        /* ── Modal create/edit ─────────────────────────────────────────── */
        openCreate() {
            this.form   = { name: '', role: '', description: '', isDefault: false }
            this.errors = { name: '', role: '' }
            this.modal  = { open: true, mode: 'create', id: null }
        },

        openEdit(professional) {
            this.form   = {
                name: professional.name,
                role: professional.role,
                description: professional.description || '',
                isDefault: professional.isDefault
            }
            this.errors = { name: '', role: '' }
            this.modal  = { open: true, mode: 'edit', id: professional.id }
        },

        closeModal() {
            this.modal.open = false
            this.saving     = false
        },

        validate() {
            this.errors = { name: '', role: '' }
            if (!this.form.name) this.errors.name = 'Informe o nome do profissional.'
            if (!this.form.role) this.errors.role = 'Informe a função na banda.'
            return !Object.values(this.errors).some(Boolean)
        },

        async save() {
            if (!this.validate()) return
            this.saving = true
            try {
                if (this.modal.mode === 'create') {
                    await this._createProfessional()
                } else {
                    await this._updateProfessional()
                }
                this.closeModal()
            } catch (err) {
                this.$store.toast.error(err.message || 'Erro ao salvar o profissional.')
            } finally {
                this.saving = false
            }
        },

        async _createProfessional() {
            const res = await fetch('/profissionais', {
                method:  'POST',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify(this.form)
            })
            if (!res.ok) throw new Error(await readError(res))
            const id = await res.json()
            this.professionals.push({ id, ...this.form })
            this.$store.toast.success(`"${this.form.name}" adicionado com sucesso!`)
        },

        async _updateProfessional() {
            const res = await fetch(`/profissionais/${this.modal.id}`, {
                method:  'PUT',
                headers: { 'Content-Type': 'application/json' },
                body:    JSON.stringify(this.form)
            })
            if (!res.ok) throw new Error(await readError(res))
            const idx = this.professionals.findIndex(p => p.id === this.modal.id)
            if (idx !== -1) this.professionals[idx] = { id: this.modal.id, ...this.form }
            this.$store.toast.success(`"${this.form.name}" atualizado com sucesso!`)
        },

        /* ── Dialog de exclusão ────────────────────────────────────────── */
        openDelete(professional) {
            this.deleteDialog = { open: true, professional, errorMsg: '' }
        },

        closeDelete() {
            this.deleteDialog.open     = false
            this.deleteDialog.errorMsg = ''
            this.deleting              = false
        },

        async executeDelete() {
            this.deleting = true
            this.deleteDialog.errorMsg = ''
            try {
                const res = await fetch(`/profissionais/${this.deleteDialog.professional.id}`, {
                    method: 'DELETE'
                })

                if (res.status === 409) {
                    this.deleteDialog.errorMsg =
                        'Este profissional está vinculado a um evento que já ocorreu e não pode ser excluído.'
                    return
                }

                if (!res.ok) throw new Error(await readError(res))

                this.professionals = this.professionals.filter(p => p.id !== this.deleteDialog.professional.id)
                this.$store.toast.success(`"${this.deleteDialog.professional.name}" excluído com sucesso!`)
                this.closeDelete()

            } catch (err) {
                this.$store.toast.error(err.message || 'Erro ao excluir o profissional.')
                this.closeDelete()
            } finally {
                this.deleting = false
            }
        }
    }
}
</script>

</body>
</html>
