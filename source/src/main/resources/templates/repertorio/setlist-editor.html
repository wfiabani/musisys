<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{repertorio/_layout :: head}"></head>
<body class="bg-gray-100 antialiased" x-data="setlistEditor()">

<div th:replace="~{repertorio/_layout :: toastWidget}"></div>

<script th:inline="javascript">
    window.__setlist   = /*[[${setlist}]]*/ {};
    window.__allMusics = /*[[${allMusics}]]*/ [];
</script>

<!-- ══════════════════════════════════════════════════════════════════════ -->
<div class="flex flex-col h-screen">

    <!-- ── Cabeçalho fixo ───────────────────────────────────────────── -->
    <header class="bg-white border-b border-gray-200 px-5 py-3.5 flex items-center gap-4 shrink-0 shadow-sm">
        <a href="/repertorio/ui/setlists"
           class="inline-flex items-center gap-1.5 text-sm text-gray-500 hover:text-brand-600
                  transition-colors font-medium">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Setlists
        </a>

        <div class="w-px h-5 bg-gray-200"></div>

        <div class="flex-1 min-w-0">
            <h1 class="text-base font-semibold text-gray-900 truncate" x-text="setlistName"></h1>
        </div>

        <span class="text-xs font-medium px-2.5 py-1 rounded-full bg-brand-50 text-brand-700"
              x-text="`${items.length} música${items.length !== 1 ? 's' : ''}`"></span>
    </header>

    <!-- ── Dois painéis ─────────────────────────────────────────────── -->
    <div class="flex flex-1 overflow-hidden gap-3 p-3">

        <!-- ════════════════════════════════════════════════════════════ -->
        <!-- Painel esquerdo — músicas do setlist                        -->
        <!-- ════════════════════════════════════════════════════════════ -->
        <div class="flex flex-col w-1/2 bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">

            <!-- Cabeçalho do painel -->
            <div class="px-4 py-3 border-b border-gray-100 flex items-center justify-between shrink-0">
                <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wide">
                    Ordem do Setlist
                </h2>
                <span x-show="items.length === 0"
                      class="text-xs text-gray-400 italic">vazio</span>
            </div>

            <!-- Lista de itens (scrollável + drag-and-drop) -->
            <div class="flex-1 overflow-y-auto">

                <!-- Estado vazio -->
                <div x-show="items.length === 0"
                     class="flex flex-col items-center justify-center h-full gap-3 text-gray-400 py-16">
                    <svg class="w-10 h-10 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                              d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
                    </svg>
                    <p class="text-sm">Nenhuma música no setlist</p>
                    <p class="text-xs text-center max-w-xs">
                        Adicione músicas pelo painel ao lado →
                    </p>
                </div>

                <!-- Lista ordenável -->
                <ul x-show="items.length > 0"
                    x-sort="onSort"
                    class="divide-y divide-gray-50 select-none">

                    <template x-for="item in sortedItems" :key="item.id">
                        <li :data-music-id="item.id"
                            x-sort:item="$el.dataset.musicId"
                            class="flex items-center gap-3 px-3 py-2.5 hover:bg-gray-50
                                   transition-colors group/item cursor-default">

                            <!-- Handle drag -->
                            <span x-sort:handle
                                  class="text-gray-300 hover:text-gray-400 cursor-grab active:cursor-grabbing
                                         transition-colors shrink-0" title="Arrastar para reordenar">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                          d="M4 8h16M4 16h16"/>
                                </svg>
                            </span>

                            <!-- Número -->
                            <span class="w-5 text-xs font-semibold text-gray-400 tabular-nums shrink-0 text-right"
                                  x-text="item.position"></span>

                            <!-- Info da música -->
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-medium text-gray-900 truncate" x-text="item.title"></p>
                                <p class="text-xs text-gray-500 truncate" x-text="item.author"></p>
                            </div>

                            <!-- Tom -->
                            <span class="shrink-0 text-xs font-semibold px-1.5 py-0.5 rounded
                                         bg-indigo-50 text-indigo-700 border border-indigo-100"
                                  x-text="item.key"></span>

                            <!-- Controles posição -->
                            <div class="flex gap-0.5 shrink-0 opacity-0 group-hover/item:opacity-100
                                        transition-opacity">
                                <button @click="moveUp(item)"
                                        :disabled="item.position === 1"
                                        title="Mover para cima"
                                        class="p-1 rounded text-gray-400 hover:text-brand-600
                                               hover:bg-brand-50 disabled:opacity-30
                                               disabled:pointer-events-none transition-colors">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7"/>
                                    </svg>
                                </button>
                                <button @click="moveDown(item)"
                                        :disabled="item.position === items.length"
                                        title="Mover para baixo"
                                        class="p-1 rounded text-gray-400 hover:text-brand-600
                                               hover:bg-brand-50 disabled:opacity-30
                                               disabled:pointer-events-none transition-colors">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/>
                                    </svg>
                                </button>
                            </div>

                            <!-- Remover -->
                            <button @click="removeMusic(item)"
                                    title="Remover do setlist"
                                    class="shrink-0 p-1 rounded text-gray-300 hover:text-red-500
                                           hover:bg-red-50 disabled:opacity-30
                                           disabled:pointer-events-none transition-colors
                                           opacity-0 group-hover/item:opacity-100">
                                <svg x-show="!removing[item.id]" class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                                </svg>
                                <svg x-show="removing[item.id]" class="w-4 h-4 animate-spin" fill="none" viewBox="0 0 24 24">
                                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"/>
                                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"/>
                                </svg>
                            </button>
                        </li>
                    </template>
                </ul>
            </div>

            <!-- Dica drag-and-drop -->
            <div x-show="items.length > 1"
                 class="px-4 py-2 border-t border-gray-100 bg-gray-50 shrink-0">
                <p class="text-xs text-gray-400 flex items-center gap-1.5">
                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8h16M4 16h16"/>
                    </svg>
                    Arraste para reordenar ou use as setas ↑↓
                </p>
            </div>
        </div>

        <!-- ════════════════════════════════════════════════════════════ -->
        <!-- Painel direito — adicionar músicas                          -->
        <!-- ════════════════════════════════════════════════════════════ -->
        <div class="flex flex-col w-1/2 bg-white rounded-xl border border-gray-200 shadow-sm overflow-hidden">

            <!-- Cabeçalho do painel -->
            <div class="px-4 py-3 border-b border-gray-100 shrink-0">
                <h2 class="text-xs font-semibold text-gray-500 uppercase tracking-wide mb-2.5">
                    Adicionar Músicas
                </h2>
                <!-- Campo de busca -->
                <div class="relative">
                    <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-3.5 h-3.5 text-gray-400 pointer-events-none"
                         fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                              d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
                    </svg>
                    <input x-model="search" type="text" placeholder="Buscar por título, artista ou tom…"
                           class="w-full pl-9 pr-8 py-2 text-xs bg-gray-50 border border-gray-200
                                  rounded-lg placeholder-gray-400 focus:outline-none
                                  focus:ring-2 focus:ring-brand-500 focus:border-transparent
                                  focus:bg-white transition"/>
                    <button x-show="search" @click="search = ''"
                            class="absolute right-2.5 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Lista de músicas disponíveis (scrollável) -->
            <div class="flex-1 overflow-y-auto">

                <!-- Vazio / sem resultados -->
                <div x-show="filteredMusics.length === 0"
                     class="flex flex-col items-center justify-center h-full gap-2 text-gray-400 py-12">
                    <svg class="w-8 h-8 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"
                              d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z"/>
                    </svg>
                    <p class="text-sm">Nenhuma música encontrada</p>
                </div>

                <!-- Itens -->
                <ul class="divide-y divide-gray-50">
                    <template x-for="music in filteredMusics" :key="music.id">
                        <li class="flex items-center gap-3 px-3 py-2.5 transition-colors"
                            :class="music.inSetlist ? 'bg-gray-50/60' : 'hover:bg-brand-50 group/avail'">

                            <!-- Ícone estado -->
                            <div class="shrink-0 w-7 h-7 rounded-full flex items-center justify-center"
                                 :class="music.inSetlist
                                     ? 'bg-emerald-100'
                                     : 'bg-gray-100 group-hover/avail:bg-brand-100 transition-colors'">
                                <!-- Já adicionada: check -->
                                <svg x-show="music.inSetlist" class="w-3.5 h-3.5 text-emerald-600"
                                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                                </svg>
                                <!-- Disponível: nota musical -->
                                <svg x-show="!music.inSetlist" class="w-3.5 h-3.5 text-gray-400 group-hover/avail:text-brand-500 transition-colors"
                                     fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                          d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
                                </svg>
                            </div>

                            <!-- Info -->
                            <div class="flex-1 min-w-0">
                                <p class="text-sm font-medium truncate"
                                   :class="music.inSetlist ? 'text-gray-500' : 'text-gray-900'"
                                   x-text="music.title"></p>
                                <p class="text-xs text-gray-400 truncate" x-text="music.author"></p>
                            </div>

                            <!-- Tom -->
                            <span class="shrink-0 text-xs font-semibold px-1.5 py-0.5 rounded
                                         border border-indigo-100"
                                  :class="music.inSetlist
                                      ? 'bg-gray-100 text-gray-400 border-gray-200'
                                      : 'bg-indigo-50 text-indigo-700'"
                                  x-text="music.key"></span>

                            <!-- Botão adicionar -->
                            <div class="shrink-0">
                                <span x-show="music.inSetlist"
                                      class="text-xs text-emerald-600 font-medium px-2 py-1">
                                    No setlist
                                </span>
                                <button x-show="!music.inSetlist"
                                        @click="addMusic(music)"
                                        class="inline-flex items-center gap-1 px-2.5 py-1.5 text-xs
                                               font-medium text-brand-600 bg-brand-50
                                               hover:bg-brand-100 hover:text-brand-700
                                               rounded-lg transition-colors border border-brand-100">
                                    <svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/>
                                    </svg>
                                    Adicionar
                                </button>
                            </div>
                        </li>
                    </template>
                </ul>
            </div>

            <!-- Rodapé do painel direito -->
            <div class="px-4 py-2 border-t border-gray-100 bg-gray-50 shrink-0">
                <p class="text-xs text-gray-400"
                   x-text="`${inSetlistCount} de ${allMusics.length} música${allMusics.length !== 1 ? 's' : ''} já no setlist`">
                </p>
            </div>
        </div>

    </div><!-- /dois painéis -->
</div><!-- /flex col h-screen -->

<!-- ══════════════════════════════════════════════════════════════════════ -->
<th:block th:replace="~{repertorio/_layout :: scripts}"></th:block>
<script>
function setlistEditor() {
    return {

        /* ── Estado ────────────────────────────────────────────────── */
        setlistId:   '',
        setlistName: '',
        items:       [],    // [{id, title, author, key, position}]
        allMusics:   [],    // [{id, title, author, key}]
        search:      '',
        adding:      {},    // {musicId: true}
        removing:    {},    // {musicId: true}
        moving:      {},    // {musicId: true}

        /* ── Inicialização ─────────────────────────────────────────── */
        init() {
            const s = window.__setlist || {}
            this.setlistId   = s.id   || ''
            this.setlistName = s.name || ''
            this.items       = (s.items || [])
                .slice()
                .sort((a, b) => a.position - b.position)
            this.allMusics   = window.__allMusics || []
        },

        /* ── Computed ──────────────────────────────────────────────── */
        get sortedItems() {
            return [...this.items].sort((a, b) => a.position - b.position)
        },

        get inSetlistCount() {
            const ids = new Set(this.items.map(i => i.id))
            return this.allMusics.filter(m => ids.has(m.id)).length
        },

        get filteredMusics() {
            const inSetlist = new Set(this.items.map(i => i.id))
            const q = this.search.toLowerCase().trim()
            return this.allMusics
                .filter(m => {
                    if (!q) return true
                    return m.title.toLowerCase().includes(q)  ||
                           m.author.toLowerCase().includes(q) ||
                           m.key.toLowerCase().includes(q)
                })
                .map(m => ({ ...m, inSetlist: inSetlist.has(m.id) }))
                // Músicas do setlist aparecem ao topo para referência visual
                .sort((a, b) => Number(b.inSetlist) - Number(a.inSetlist))
        },

        /* ── Adicionar música ──────────────────────────────────────── */
        async addMusic(music) {
            if (this.adding[music.id]) return
            this.adding = { ...this.adding, [music.id]: true }
            try {
                const res = await fetch(
                    `/repertorio/setlists/${this.setlistId}/musics/${music.id}`,
                    { method: 'POST' }
                )
                if (!res.ok) throw new Error(await readError(res))
                this.items = [
                    ...this.items,
                    { id: music.id, title: music.title, author: music.author,
                      key: music.key, position: this.items.length + 1 }
                ]
                this.$store.toast.success(`"${music.title}" adicionada!`)
            } catch (err) {
                this.$store.toast.error(err.message || 'Erro ao adicionar música.')
            } finally {
                const next = { ...this.adding }
                delete next[music.id]
                this.adding = next
            }
        },

        /* ── Remover música ────────────────────────────────────────── */
        async removeMusic(item) {
            if (this.removing[item.id]) return
            this.removing = { ...this.removing, [item.id]: true }
            try {
                const res = await fetch(
                    `/repertorio/setlists/${this.setlistId}/musics/${item.id}`,
                    { method: 'DELETE' }
                )
                if (!res.ok) throw new Error(await readError(res))
                this.items = this.items
                    .filter(i => i.id !== item.id)
                    .map((i, idx) => ({ ...i, position: idx + 1 }))
                this.$store.toast.success(`"${item.title}" removida do setlist.`)
            } catch (err) {
                this.$store.toast.error(err.message || 'Erro ao remover música.')
            } finally {
                const next = { ...this.removing }
                delete next[item.id]
                this.removing = next
            }
        },

        /* ── Reordenar: setas ──────────────────────────────────────── */
        async moveUp(item) {
            if (item.position <= 1) return
            await this._reorder(item, item.position - 1)
        },

        async moveDown(item) {
            if (item.position >= this.items.length) return
            await this._reorder(item, item.position + 1)
        },

        /* ── Reordenar: drag-and-drop (@alpinejs/sort) ─────────────── */
        onSort(musicId, newPosition) {
            const position = newPosition + 1  // @alpinejs/sort passa newIndex 0-based
            const item = this.items.find(i => i.id === musicId)
            if (!item || item.position === position) return
            // Atualização otimista — DOM já foi reordenado pelo Sort plugin
            const oldPosition = item.position
            this._applyReorder(musicId, position)
            // Persiste no servidor (reverte se falhar)
            this._persistReorder(musicId, position, oldPosition)
        },

        /* ── Helpers de reordenação ────────────────────────────────── */
        async _reorder(item, newPosition) {
            if (this.moving[item.id]) return
            this.moving = { ...this.moving, [item.id]: true }
            const oldPosition = item.position
            this._applyReorder(item.id, newPosition)
            try {
                await this._persistReorder(item.id, newPosition, oldPosition)
            } finally {
                const next = { ...this.moving }
                delete next[item.id]
                this.moving = next
            }
        },

        _applyReorder(musicId, newPosition) {
            const arr = [...this.items].sort((a, b) => a.position - b.position)
            const fromIdx = arr.findIndex(i => i.id === musicId)
            const toIdx   = newPosition - 1
            if (fromIdx === -1) return
            const [moved] = arr.splice(fromIdx, 1)
            arr.splice(toIdx, 0, moved)
            this.items = arr.map((i, idx) => ({ ...i, position: idx + 1 }))
        },

        async _persistReorder(musicId, newPosition, oldPosition) {
            try {
                const res = await fetch(
                    `/repertorio/setlists/${this.setlistId}/musics/${musicId}/position`,
                    {
                        method:  'PUT',
                        headers: { 'Content-Type': 'application/json' },
                        body:    JSON.stringify({ position: newPosition })
                    }
                )
                if (!res.ok) throw new Error(await readError(res))
            } catch (err) {
                // Reverte a ordem local
                this._applyReorder(musicId, oldPosition)
                this.$store.toast.error(err.message || 'Erro ao reordenar. Posição revertida.')
            }
        }
    }
}
</script>

</body>
</html>
